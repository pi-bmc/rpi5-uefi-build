#@TYPE: Machine
#@NAME: Raspberry Pi 5 (BCM2712, Cortex-A76) -- TF-A/EDK2 firmware build only
#@DESCRIPTION: Vehicle for cross-building the Raspberry Pi 5 UEFI firmware
# (TF-A BL31 + EDK2 RPI_EFI.fd) under bitbake from an x86_64 (or any other)
# build host. Cortex-A76 tune gets a real aarch64 cross toolchain built
# automatically via the normal DEPENDS chain -- neither the arm-trusted-firmware
# nor the rpi5-uefi-firmware recipe carries its own crossgcc the way
# meta-nuc-bios's coreboot recipe does, because here host and target arch
# genuinely differ.
#
# No OS image is ever built for this machine; the deliverable is
# RPI_EFI.fd + config.txt in DEPLOY_DIR_IMAGE (see rpi5-uefi-firmware.bb).

require conf/machine/include/arm/armv8-2a/tune-cortexa76.inc
