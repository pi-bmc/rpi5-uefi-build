BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi5-uefi"
BBFILE_PATTERN_rpi5-uefi = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi5-uefi = "10"

LAYERSERIES_COMPAT_rpi5-uefi = "scarthgap"

# edk2's BaseTools VfrCompile (vendored Pccts/antlr) invokes a bare `cc`/`c++`
# rather than $(CC); bitbake's sanitised PATH only exposes gcc/g++, so the
# nested make dies five levels deep with "cc: No such file or directory".
# Same issue as meta-nuc-bios's x86 payload build; see that layer.conf.
HOSTTOOLS += "cc c++"
