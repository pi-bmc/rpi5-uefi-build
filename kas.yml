# kas configuration for the standalone Raspberry Pi 5 UEFI firmware build
# Usage: kas build kas.yml           -> deploys rpi5-uefi-sd.img (flashable SD
#        image: armstub8-2712.bin + config.txt + DTBs + overlays on one FAT32
#        boot partition) plus the raw RPI_EFI.fd/armstub8-2712.bin artifacts,
#        under build/tmp/deploy/images/raspberrypi5-uefi/
# Install kas: pip3 install kas

header:
  version: 14

machine: raspberrypi5-uefi
distro: poky
target: rpi5-uefi-sdimg

build_system: openembedded

# Forwarded to bitbake as BB_ENV_PASSTHROUGH_ADDITIONS, so that
#   RPI5_FMP=1 kas build kas.yml
# reaches the edk2-rpi5-firmware recipe. kas builds an otherwise clean
# environment: without this block those assignments are accepted by the shell,
# never seen by bitbake, and the build quietly comes out with FMP off. Null
# means "forward only if set", leaving the recipe's own defaults in charge.
env:
  RPI5_FMP:
  RPI5_FMP_CERT:
  RPI5_FMP_KEY:
  RPI5_FMP_KEYDIR:
  RPI5_FMP_VERSION:
  RPI5_FMP_LSV:

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  # Local layer (inside this repo)
  meta-rpi5-uefi:
    path: meta-rpi5-uefi
    layers:
      .:

local_conf_header:
  rpi5-uefi: |
    # NanoKVM build configuration
    MACHINE = "raspberrypi5-uefi"
    DISTRO = "poky"
    # Use musl libc to match the original Buildroot build
    TCLIBC = "musl"
    # Parallel build tuning
    BB_NUMBER_THREADS = "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE = "-j ${@oe.utils.cpu_count()}"
    # Disable interactive prompts
    CONNECTIVITY_CHECK_URIS = ""
    # Embed the iPXE UNDI/SNP driver (built by the ipxe-efi recipe) into the
    # DXE firmware volume, since RP1's onboard Ethernet has no edk2 driver of
    # its own. This enables PXE boot from an add-on PCIe or USB NIC that iPXE
    # recognises -- NOT the onboard RJ45 jack. Set to "0" for a plain,
    # unmodified RPi5.fdf build.
    # RPI5_IPXE = "1"
    # RELEASE (default), DEBUG or NOOPT. Bring-up used DEBUG for the serial
    # DEBUG() stream and the 0xAF freed-pool fill; flip back when chasing
    # crashes.
    RPI5_BUILD_TARGET = "RELEASE"
    # Build ShellPkg's Dp command into the firmware: `dp` at the UEFI shell
    # then prints per-driver init times (the platform already records the
    # measurements). Set to "0" to drop it and reclaim the FV space.
    PROFILING_ENABLED = "1"
    # Shared download and sstate directories (can be overridden per user)
    DL_DIR = "/opt/yocto/downloads"
    SSTATE_DIR = "/opt/yocto/sstate-cache"
